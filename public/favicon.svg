<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
>
  <style>
    .favicon-light {
      display: block;
    }

    .favicon-dark {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .favicon-light {
        display: none;
      }

      .favicon-dark {
        display: block;
      }
    }
  </style>

  <image
    class="favicon-light"
    x="0"
    y="0"
    width="32"
    height="32"
    href="data:image/png;base64,"
  />

  <image
    class="favicon-dark"
    x="0"
    y="0"
    width="32"
    height="32"
    href="data:image/png;base64,"
  />
</svg>